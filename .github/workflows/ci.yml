name: ULE CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest

    env:
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-key-32-chars-long!
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @ule/contracts build

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Build backend and frontend applications
        run: pnpm --filter @ule/api build && pnpm --filter @ule/web build

      - name: Run unit & contract tests
        run: pnpm test

      - name: Run API e2e tests (mocked database)
        run: pnpm --filter @ule/api test:e2e

  database-integration:
    name: PostgreSQL Migration & Real DB Integration
    runs-on: ubuntu-latest
    needs: validate

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ule_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ule_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ule_ci?schema=public
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-key-32-chars-long!
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @ule/contracts build

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply Prisma migrations to PostgreSQL service
        run: pnpm --filter @ule/api prisma:deploy

      - name: Execute real database integration tests
        run: pnpm --filter @ule/api test:integration
